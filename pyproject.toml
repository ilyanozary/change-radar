[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "change-radar"
version = "0.1.0a1"
description = "Local evidence-first Python and FastAPI change impact analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
[project.scripts]
change-radar = "change_radar.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
change_radar = ["*.html", "skill/*.md"]

[tool.ruff]
target-version = "py311"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
